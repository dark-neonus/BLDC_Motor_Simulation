[package]
name = "sim-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
rmp-serde = "1.3.1"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.151"
sim-core.workspace = true
sim-model.workspace = true
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30.0"
