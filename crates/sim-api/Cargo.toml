[package]
name = "sim-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
open = "5.4.4"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
rmp-serde = "1.3.1"
rust-embed = { version = "8.13.0", features = ["mime-guess"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.151"
sim-core.workspace = true
sim-model.workspace = true
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing.workspace = true

[features]
# Embed the built web UI (web/dist) and docs (docs/build) into the binary (D-009).
embed-ui = ["dep:rust-embed"]
embed-docs = ["dep:rust-embed"]

[lints]
workspace = true

[dev-dependencies]
anyhow.workspace = true
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rmcp = { version = "3.5.1", features = ["client", "transport-streamable-http-client-reqwest"] }
tokio-tungstenite = "0.30.0"

