[project]
name = "bldc-validation"
version = "0.1.0"
description = "Independent validation suite for the BLDC simulator (D-005: Python 3.13)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "polars>=2.0.0",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
