[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = ""

[workspace.dependencies]
# internal crates
sim-model = { path = "crates/sim-model" }
sim-core = { path = "crates/sim-core" }
sim-api = { path = "crates/sim-api" }
# shared external crates
serde = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
# test-only
approx = "0.5"
proptest = "1"
insta = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1          # keep symbols for profiling (flamegraph)
