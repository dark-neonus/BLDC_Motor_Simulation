name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          # cargo-binstall first so the cargo: tools install as prebuilt binaries
          install_args: "cargo-binstall rust cargo:cargo-nextest"
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci-run.sh "cargo fmt" cargo fmt --all --check
      - run: scripts/ci-run.sh "cargo clippy" cargo clippy --workspace --all-targets -- -D warnings
      - run: scripts/ci-run.sh "cargo nextest" cargo nextest run --workspace --no-tests=pass

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: "node pnpm"
      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: scripts/ci-run.sh "pnpm config" pnpm config set store-dir ~/.local/share/pnpm/store
      - run: scripts/ci-run.sh "pnpm install" pnpm install --frozen-lockfile
      - run: scripts/ci-run.sh "pnpm biome" pnpm biome check .
      - run: scripts/ci-run.sh "pnpm -C" pnpm -C web exec tsc -b --noEmit
      - run: scripts/ci-run.sh "pnpm -C" pnpm -C web test --run
      - run: scripts/ci-run.sh "pnpm -C" pnpm -C web build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: "python uv"
      - name: uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('validation/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: scripts/ci-run.sh "python3 Context/plan/progress.py" python3 Context/plan/progress.py --check
      - working-directory: validation
        run: ../scripts/ci-run.sh "uv sync" uv sync --frozen
      - working-directory: validation
        run: ../scripts/ci-run.sh "ruff check" uv run ruff check .
      - working-directory: validation
        run: ../scripts/ci-run.sh "ruff format" uv run ruff format --check .
      - working-directory: validation
        run: ../scripts/ci-run.sh "pytest" uv run pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: "cargo-binstall rust node pnpm just"
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci-run.sh "pnpm install" pnpm install --frozen-lockfile
      - run: scripts/ci-run.sh "pnpm -C" pnpm -C web exec playwright install --with-deps chromium
      - run: scripts/ci-run.sh "just e2e" just e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: web/test-results/
          retention-days: 7

  # Enabled in later phases:
  # validate:  (P11.T09) just validate && just validate-report
  # docs:      (P18)     pnpm -C docs build + help/eq-id/docs-gen no-diff checks
