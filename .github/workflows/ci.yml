name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          # cargo-binstall first so the cargo: tools install as prebuilt binaries
          install_args: "cargo-binstall rust cargo:cargo-nextest"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --no-tests=pass

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: "node pnpm"
      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm config set store-dir ~/.local/share/pnpm/store
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm -C web exec tsc -b --noEmit
      - run: pnpm -C web test --run
      - run: pnpm -C web build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: "python uv"
      - name: uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('validation/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: python3 Context/plan/progress.py --check
      - working-directory: validation
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

  # Enabled in later phases:
  # e2e:       (P01.T11) just build && pnpm -C web exec playwright install --with-deps chromium && just e2e
  # validate:  (P11.T09) just validate && just validate-report
  # docs:      (P18)     pnpm -C docs build + help/eq-id/docs-gen no-diff checks
