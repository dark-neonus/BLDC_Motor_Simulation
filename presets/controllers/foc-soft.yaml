# yaml-language-server: $schema=../../schemas/controller.schema.json
# Sensored FOC, gentle: gains from the motor (EQ-CTRL-03/04); override limits.current per motor.
family: foc
current: { rate: 20 kHz, bandwidth: 500 Hz }
velocity: { rate: 5 kHz, bandwidth: 10 Hz }
position: { rate: 1 kHz, bandwidth: 2 Hz, enabled: false }
limits: { current: 5 A }
